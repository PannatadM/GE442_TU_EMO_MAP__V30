<!DOCTYPE html>
<html>
<head>
    
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    
<style>
  @import url("https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700;800&display=swap");

  :root {
    --tu-text: #0f172a;
    --tu-muted: #64748b;
    --tu-border: rgba(255,255,255,.42);
    --tu-glass: rgba(244, 247, 255, .80);
    --tu-glass-strong: rgba(255, 255, 255, .90);
    --tu-shadow: 0 24px 60px rgba(15, 23, 42, .18);
    --tu-shadow-soft: 0 12px 26px rgba(148, 163, 184, .16);
  }

  .leaflet-container,
  .leaflet-control,
  .leaflet-popup-content-wrapper {
    font-family: "Sarabun", "TH Sarabun New", "Noto Sans Thai", Tahoma, Arial, sans-serif !important;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .leaflet-popup-content-wrapper {
    border-radius: 28px !important;
    background: linear-gradient(135deg, rgba(255,255,255,.74), rgba(240,244,255,.58)) !important;
    backdrop-filter: blur(24px) saturate(1.45);
    -webkit-backdrop-filter: blur(24px) saturate(1.45);
    border: 1px solid rgba(255,255,255,.68);
    box-shadow: var(--tu-shadow), inset 0 1px 0 rgba(255,255,255,.72) !important;
    overflow: hidden;
  }

  .leaflet-popup-tip {
    background: rgba(245,248,255,.94) !important;
    box-shadow: 0 10px 24px rgba(15, 23, 42, .14) !important;
  }

  .leaflet-popup-content {
    margin: 0 !important;
    width: 820px !important;
    max-width: min(820px, calc(100vw - 36px)) !important;
  }

  /* popup ย่อยรายอารมณ์ต้องไม่ใช้ความกว้าง 820px ของ popup หลัก */
  .leaflet-popup:has(.tu-mini-popup) .leaflet-popup-content-wrapper {
    width: auto !important;
    min-width: 0 !important;
    max-width: 250px !important;
  }

  .leaflet-popup:has(.tu-mini-popup) .leaflet-popup-content {
    width: auto !important;
    min-width: 0 !important;
    max-width: 250px !important;
    margin: 0 !important;
  }

  .leaflet-popup:has(.tu-mini-popup) {
    max-width: 250px !important;
  }

  /* ให้ popup ข้อมูลรวมไม่บล็อกการเลื่อน/ลากแผนที่ */
  .leaflet-popup:has(.tu-popup-shell) .leaflet-popup-content-wrapper,
  .leaflet-popup:has(.tu-popup-shell) .leaflet-popup-tip,
  .leaflet-popup:has(.tu-popup-shell) .leaflet-popup-content,
  .leaflet-popup:has(.tu-popup-shell) .tu-popup-shell {
    pointer-events: none !important;
  }

  .leaflet-popup:has(.tu-popup-shell) .leaflet-popup-close-button {
    pointer-events: auto !important;
    z-index: 1000 !important;
  }

  /* fallback สำหรับมือถือ/iPad: ใช้ class จาก JavaScript แทน :has() เพื่อให้ลากแผนที่ผ่าน popup หลักได้ */
  .leaflet-popup.tu-popup-main-active .leaflet-popup-content-wrapper,
  .leaflet-popup.tu-popup-main-active .leaflet-popup-tip,
  .leaflet-popup.tu-popup-main-active .leaflet-popup-content,
  .leaflet-popup.tu-popup-main-active .tu-popup-shell {
    pointer-events: none !important;
    touch-action: none !important;
  }

  .leaflet-popup.tu-popup-main-active .leaflet-popup-close-button {
    pointer-events: auto !important;
    touch-action: manipulation !important;
    z-index: 1000 !important;
  }

  .tu-popup-shell {
    color: var(--tu-text);
    padding: 14px;
    background:
      radial-gradient(circle at 10% 10%, rgba(var(--tu-accent-rgb, 96,165,250), .34), transparent 38%),
      radial-gradient(circle at 100% 0%, rgba(var(--tu-accent-rgb, 96,165,250), .16), transparent 26%),
      linear-gradient(155deg, rgba(255,255,255,.82), rgba(var(--tu-accent-rgb, 226,232,240), .20) 58%, rgba(241,245,249,.68));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.76), inset 0 0 0 1px rgba(var(--tu-accent-rgb, 226,232,240), .08);
  }

  .tu-popup-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }

  .tu-place-name {
    font-size: 22px;
    line-height: 1.22;
    font-weight: 800;
    letter-spacing: -.02em;
  }

  .tu-place-meta {
    margin-top: 3px;
    font-size: 11px;
    color: var(--tu-muted);
  }

  .tu-summary-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(255,255,255,.72);
    background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(255,255,255,.56));
    border-radius: 999px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: var(--tu-shadow-soft), inset 0 1px 0 rgba(255,255,255,.72);
  }

  .tu-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display: inline-block;
    flex: 0 0 auto;
    box-shadow: 0 0 0 3px rgba(255,255,255,.75);
  }

  .tu-stat-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }

  .tu-stat-card, .tu-glass-card, .tu-mini-popup, .tu-legend-chip, .tu-emotion-card, .tu-gender-chip, .tu-reason-row {
    border: 1px solid rgba(255,255,255,.58);
    background: linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.46));
    box-shadow: var(--tu-shadow-soft), inset 0 1px 0 rgba(255,255,255,.82), 0 0 0 1px rgba(var(--tu-accent-rgb, 226,232,240), .10);
  }

  .tu-stat-card { border-radius: 18px; padding: 9px 10px; }
  .tu-stat-card span, .tu-emotion-sub, .tu-mini-stats span, .tu-reason-sub, .tu-legend-chip-sub { display: block; color: var(--tu-muted); font-size: 11px; }
  .tu-stat-card b { display: inline-block; margin-top: 3px; font-size: 18px; line-height: 1.1; }
  .tu-stat-card small { margin-left: 5px; color: var(--tu-muted); font-size: 11px; }

  .tu-popup-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(250px, .8fr); gap: 10px; align-items: start; }
  .tu-left-col, .tu-right-col { display: grid; gap: 10px; }
  .tu-glass-card { border-radius: 22px; padding: 10px; }
  .tu-compact-card { padding: 10px; }
  .tu-card-title { font-size: 13px; font-weight: 800; margin-bottom: 8px; color: #0f172a; }

  .tu-chart-layout { display: grid; grid-template-columns: 222px minmax(0, 1fr); gap: 10px; align-items: center; }
  .tu-svg-wrap { display: flex; align-items: center; justify-content: center; }
  .tu-polar-svg { width: 214px; height: 214px; overflow: visible; filter: drop-shadow(0 16px 20px rgba(15,23,42,.10)); }
  .tu-sector-shape { stroke: rgba(255,255,255,.48); stroke-width: 1.5; filter: drop-shadow(0 8px 14px rgba(15,23,42,.10)); }
  .tu-svg-center-total { fill: #0f172a; font-size: 18px; font-weight: 900; }
  .tu-svg-center-label { fill: #64748b; font-size: 10px; font-weight: 700; }
  .tu-chart-legends { display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start; align-content: flex-start; }
  .tu-legend-chip { display: inline-flex; flex-direction: column; align-items: flex-start; border-radius: 12px; padding: 5px 7px; width: auto; min-width: unset; max-width: max-content; flex: 0 0 auto; }
  .tu-legend-chip-top { display: inline-flex; align-items: center; justify-content: flex-start; gap: 6px; }
  .tu-pie-legend-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 11px; font-weight: 700; }
  .tu-pie-legend-value { color: #334155; font-weight: 800; white-space: nowrap; font-size: 10px; }
  .tu-legend-chip-sub { margin-top: 2px; padding-left: 16px; font-size: 10px !important; white-space: nowrap; }

  .tu-emotion-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tu-emotion-card { border-radius: 18px; padding: 9px; min-height: 88px; }
  .tu-emotion-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .tu-emotion-head { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
  .tu-emotion-name { line-height: 1.2; }
  .tu-emotion-values { text-align: right; }
  .tu-emotion-main { font-size: 15px; font-weight: 800; line-height: 1.05; }
  .tu-emotion-reason { margin-top: 8px; font-size: 11px; line-height: 1.45; color: #334155; }
  .tu-emotion-reason span, .tu-mini-reason span { font-weight: 800; color: #0f172a; }

  .tu-gender-grid { display: grid; gap: 7px; }
  .tu-gender-chip { border-radius: 15px; padding: 8px 9px; font-size: 11.5px; line-height: 1.4; color: #334155; }
  .tu-overall-reasons { display: grid; gap: 7px; }
  .tu-reason-row { border-radius: 16px; padding: 8px 9px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: center; }
  .tu-rank-badge { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(255,255,255,.92), rgba(226,232,240,.72)); color: #0f172a; font-size: 12px; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,.86); }
  .tu-reason-name { font-size: 12px; font-weight: 700; color: #0f172a; line-height: 1.35; }
  .tu-empty-note { font-size: 11px; color: var(--tu-muted); }

  .tu-mini-popup {
    min-width: 214px;
    max-width: 250px;
    border-radius: 20px;
    padding: 10px;
    color: var(--tu-text);
    background:
      radial-gradient(circle at 12% 8%, rgba(var(--tu-mini-accent-rgb, 96,165,250), .28), transparent 42%),
      linear-gradient(150deg, rgba(255,255,255,.86), rgba(var(--tu-mini-accent-rgb, 226,232,240), .18) 64%, rgba(248,250,252,.80));
    border: 1px solid rgba(255,255,255,.74);
    box-shadow: 0 14px 28px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.82), inset 0 0 0 1px rgba(255,255,255,.18);
    backdrop-filter: blur(22px) saturate(1.38);
    -webkit-backdrop-filter: blur(22px) saturate(1.38);
    box-sizing: border-box;
    display: grid;
    gap: 8px;
  }
  .tu-mini-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 0;
  }
  .tu-mini-title {
    font-size: 13.5px;
    font-weight: 800;
    line-height: 1.24;
    letter-spacing: -.01em;
    max-width: 130px;
  }
  .tu-mini-pill {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.82);
    border: 1px solid rgba(255,255,255,.78);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1;
    color: #334155;
    white-space: nowrap;
  }
  .tu-mini-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .tu-mini-stats div {
    border-radius: 14px;
    padding: 8px;
    background: rgba(255,255,255,.58);
    border: 1px solid rgba(255,255,255,.70);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
    box-sizing: border-box;
  }
  .tu-mini-stats span {
    font-size: 10.5px !important;
    font-weight: 600;
    letter-spacing: -.01em;
    color: #64748b;
  }
  .tu-mini-stats b {
    display: block;
    margin-top: 3px;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.12;
    color: #0f172a;
  }
  .tu-mini-reason {
    margin-top: 0;
    padding: 8px;
    border-radius: 14px;
    background: rgba(255,255,255,.50);
    border: 1px solid rgba(255,255,255,.68);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.80);
    box-sizing: border-box;
    font-size: 11.25px;
    font-weight: 500;
    line-height: 1.46;
    letter-spacing: -.01em;
    color: #334155;
  }
  .tu-mini-reason span {
    font-weight: 800;
    color: #0f172a;
  }


.tu-place-label-icon {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  pointer-events: none !important;
}

.tu-place-label-wrap {
  position: absolute;
  transform: translate(8px, -32px);
  width: 180px;
  pointer-events: none;
}

.tu-place-label {
  display: inline-block;
  max-width: 100%;
  min-width: 54px;
  min-height: 24px;
  padding: 4px 8px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.78);
  background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(248,250,252,.82));
  box-shadow: 0 6px 14px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.92);
  backdrop-filter: blur(12px) saturate(1.10);
  -webkit-backdrop-filter: blur(12px) saturate(1.10);
  color: #0f172a;
  text-align: center;
  box-sizing: border-box;
  pointer-events: none;
}

.tu-place-label-text {
  display: block;
  max-width: 100%;
  font-size: 10.1px;
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -.01em;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: normal;
}

  .tu-map-legend, .leaflet-control-layers-expanded { background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(241,245,249,.56)) !important; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(255,255,255,.72) !important; border-radius: 22px !important; box-shadow: 0 16px 38px rgba(15,23,42,.16) !important; color: #0f172a; }
  .leaflet-control-layers-expanded { max-height: 82vh !important; min-width: 292px !important; overflow-y: auto !important; padding: 12px 14px !important; }
  .leaflet-control-layers-toggle {
    border-radius: 18px !important;
    background-color: rgba(255,255,255,.82) !important;
    backdrop-filter: blur(14px) saturate(1.25);
    -webkit-backdrop-filter: blur(14px) saturate(1.25);
    box-shadow: 0 12px 28px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.86) !important;
    cursor: pointer !important;
  }
  .tu-layer-panel {
    padding: 10px 12px !important;
  }
  .tu-layer-panel .leaflet-control-layers-toggle {
    display: none !important;
  }
  .tu-layer-toggle-btn {
    display: block;
    width: 100%;
    margin: 0 0 8px 0;
    padding: 8px 10px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.72);
    background: rgba(255,255,255,.82);
    color: #0f172a;
    font-family: "Sarabun", "TH Sarabun New", "Noto Sans Thai", Tahoma, Arial, sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.86), 0 8px 18px rgba(15,23,42,.10);
  }
  .tu-layer-toggle-btn:hover {
    background: rgba(255,255,255,.94);
  }
  .tu-layer-panel.tu-layer-collapsed .leaflet-control-layers-list {
    display: none !important;
  }
  .tu-layer-panel.tu-layer-collapsed {
    min-width: 170px !important;
    padding: 8px !important;
  }
  .tu-layer-panel.tu-layer-collapsed .tu-layer-toggle-btn {
    margin-bottom: 0;
  }
  .tu-map-legend { position: fixed; bottom: 20px; left: 20px; z-index: 9999; padding: 13px 14px; font-family: Tahoma, Arial, sans-serif; font-size: 12px; line-height: 1.5; max-width: 300px; }
  .tu-legend-title { font-size: 13px; font-weight: 800; margin-bottom: 7px; }
  .tu-legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .tu-legend-note { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(203,213,225,.75); color: #475569; font-size: 11px; }

  @media (max-width: 920px) {
    .leaflet-popup-content { width: calc(100vw - 36px) !important; max-width: calc(100vw - 36px) !important; }
    .tu-popup-grid, .tu-chart-layout { grid-template-columns: 1fr; }
    .tu-polar-svg { width: 196px; height: 196px; }
    .tu-chart-legends { display: flex; flex-wrap: wrap; }
    .tu-emotion-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 640px) {
    .tu-popup-header, .tu-stat-row { grid-template-columns: 1fr; flex-direction: column; }
    .tu-stat-row { display: grid; }
    .tu-polar-svg { width: 176px; height: 176px; }
    .tu-chart-legends { display: flex; flex-direction: column; }
    .tu-emotion-grid, .tu-mini-stats { grid-template-columns: 1fr; }
  }
</style>

<div class="tu-map-legend">

      <span class='tu-dot' style='background:#eab308;'></span>

    <div class='tu-legend-row'>

<div style="
    position: fixed;
    top: 92px;
    left: 18px;
    z-index: 9999;

<script>
setTimeout(function() {
  var mapObj = map_984dbc1ff21b27c3c1e0715ab9e47ead;
  if (!mapObj) return;

  function tunePopup(e) {
    var popupEl = e && e.popup && e.popup.getElement ? e.popup.getElement() : null;
    if (!popupEl) return;

    var wrapper = popupEl.querySelector('.leaflet-popup-content-wrapper');
    var content = popupEl.querySelector('.leaflet-popup-content');
    if (!wrapper || !content) return;

    var isMini = !!content.querySelector('.tu-mini-popup');
    var isMain = !!content.querySelector('.tu-popup-shell');

    function setImportant(el, prop, value) {
      if (!el) return;
      el.style.setProperty(prop, value, 'important');
    }

    popupEl.classList.toggle('tu-popup-mini-active', isMini);
    popupEl.classList.toggle('tu-popup-main-active', isMain);

    var shell = content.querySelector('.tu-popup-shell');
    var tip = popupEl.querySelector('.leaflet-popup-tip');
    var closeButton = popupEl.querySelector('.leaflet-popup-close-button');

    if (isMini) {
      var miniWidth = Math.min(250, Math.max(214, window.innerWidth - 72));
      setImportant(wrapper, 'width', 'auto');
      setImportant(wrapper, 'max-width', miniWidth + 'px');
      setImportant(wrapper, 'min-width', '0px');
      setImportant(wrapper, 'pointer-events', 'auto');
      setImportant(wrapper, 'touch-action', 'auto');
      setImportant(content, 'width', 'auto');
      setImportant(content, 'max-width', miniWidth + 'px');
      setImportant(content, 'min-width', '0px');
      setImportant(content, 'margin', '0');
      setImportant(content, 'pointer-events', 'auto');
      setImportant(content, 'touch-action', 'auto');
      if (tip) setImportant(tip, 'pointer-events', 'auto');
    } else if (isMain) {
      var mainWidth = Math.min(820, window.innerWidth - 36);
      setImportant(wrapper, 'width', mainWidth + 'px');
      setImportant(wrapper, 'max-width', mainWidth + 'px');
      setImportant(wrapper, 'min-width', '0px');
      setImportant(wrapper, 'pointer-events', 'none');
      setImportant(wrapper, 'touch-action', 'none');
      setImportant(content, 'width', mainWidth + 'px');
      setImportant(content, 'max-width', mainWidth + 'px');
      setImportant(content, 'min-width', '0px');
      setImportant(content, 'margin', '0');
      setImportant(content, 'pointer-events', 'none');
      setImportant(content, 'touch-action', 'none');
      if (shell) {
        setImportant(shell, 'pointer-events', 'none');
        setImportant(shell, 'touch-action', 'none');
      }
      if (tip) setImportant(tip, 'pointer-events', 'none');
      if (closeButton) {
        setImportant(closeButton, 'pointer-events', 'auto');
        setImportant(closeButton, 'touch-action', 'manipulation');
      }
    }

    // หลังปรับขนาด popup ต้องให้ Leaflet คำนวณตำแหน่งใหม่ ไม่อย่างนั้นจะลอยไปทางซ้ายในการกดครั้งแรก
    if (e && e.popup && e.popup.update) {
      setTimeout(function() { e.popup.update(); }, 0);
      setTimeout(function() { e.popup.update(); }, 60);
    }
  }

  mapObj.on('popupopen', function(e) {
    tunePopup(e);
    if (mapObj.dragging) mapObj.dragging.enable();
    if (mapObj.touchZoom) mapObj.touchZoom.enable();
    if (mapObj.scrollWheelZoom) mapObj.scrollWheelZoom.enable();
  });
  window.addEventListener('resize', function() {
    var activePopup = mapObj._popup;
    if (activePopup) tunePopup({popup: activePopup});
  });
}, 0);
</script>
